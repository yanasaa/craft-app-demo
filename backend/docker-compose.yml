version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV_FILE: .env
    image: backend:latest
    command: bash -c "sleep 10 && python manage.py collectstatic --no-input && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
    links:
      - db:db
    networks:
      - django-network
    volumes:
      - ./app/:/code/
      - media:/code/media
      - static:/code/static
      - .env:/code/.env

  db:
    container_name: db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: craftshare
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - django-network

networks:
  django-network:
    driver: bridge

volumes:
  postgres_data:
  static:
  media:
